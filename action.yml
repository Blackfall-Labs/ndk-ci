# Install nod, the Noderalis development kit, from this repository's releases.
#
# Downloads the release for this runner (tag nod-v<version>), checks
# SHA256SUMS.sig against the Blackfall release key in release/, checks the
# archive against SHA256SUMS with release/verify.sh, and only then puts nod on
# PATH. Nothing runs that has not been verified, and Blackfall's own
# repositories install nod exactly this way.
name: setup-nod
description: Install a verified nod (the Noderalis development kit).
branding:
  icon: package
  color: gray-dark

inputs:
  version:
    description: The nod release to install, such as 0.2.0. "latest" takes the newest nod release.
    required: false
    default: latest
  toolchain:
    description: Rust toolchain for building modules, with the wasm32 target.
    required: false
    default: stable

outputs:
  version:
    description: The nod version installed.
    value: ${{ steps.get.outputs.version }}

runs:
  using: composite
  steps:
    - name: Toolchain
      shell: bash
      env:
        TC: ${{ inputs.toolchain }}
      run: |
        rustup toolchain install "$TC" --profile minimal --target wasm32-unknown-unknown
        rustup default "$TC"

    - name: Download and verify nod
      id: get
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.version }}
        ACTION_REPO: ${{ github.action_repository || 'Blackfall-Labs/ndk-ci' }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        pub="$ACTION_PATH/release/blackfall-release.pub"
        if [ ! -s "$pub" ]; then
          echo "::error::No nod release has been published yet: the Blackfall release key is not in this repository."
          exit 1
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)     target=x86_64-unknown-linux-gnu;  ext=tar.gz ;;
          Linux-ARM64)   target=aarch64-unknown-linux-gnu; ext=tar.gz ;;
          macOS-X64)     target=x86_64-apple-darwin;       ext=tar.gz ;;
          macOS-ARM64)   target=aarch64-apple-darwin;      ext=tar.gz ;;
          Windows-X64)   target=x86_64-pc-windows-msvc;    ext=zip ;;
          Windows-ARM64) target=aarch64-pc-windows-msvc;   ext=zip ;;
          *) echo "::error::No nod release is built for $RUNNER_OS $RUNNER_ARCH."; exit 1 ;;
        esac
        if [ "$VERSION" = latest ]; then
          tag=$(gh release list --repo "$ACTION_REPO" --limit 100 --json tagName -q '.[].tagName' \
                | grep -E '^nod-v[0-9]' | head -n1 || true)
          [ -n "$tag" ] || { echo "::error::No nod release has been published yet."; exit 1; }
        else
          tag="nod-v${VERSION#v}"
        fi
        version="${tag#nod-v}"
        asset="nod-$version-$target.$ext"
        dir="$RUNNER_TEMP/nod-$version"
        mkdir -p "$dir"
        gh release download "$tag" --repo "$ACTION_REPO" --dir "$dir" --clobber \
          -p "$asset" -p SHA256SUMS -p SHA256SUMS.sig
        bash "$ACTION_PATH/release/verify.sh" "$dir" --pubkey "$pub" "$asset"
        cd "$dir"
        if [ "$ext" = zip ]; then unzip -q -o "$asset"; else tar -xzf "$asset"; fi
        echo "$dir/nod-$version-$target" >> "$GITHUB_PATH"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: nod version
      shell: bash
      run: nod --version
