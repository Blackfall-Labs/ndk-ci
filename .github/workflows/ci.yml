# Checks every change to this public repository before it can merge.

name: ndk ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-only:
    name: nothing that should not be public
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secrets, across the whole history
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$url" -o gitleaks.tgz
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

      - name: Private names, paths and links
        run: python3 tools/leak-check.py

      - name: The binary check catches a build path
        run: |
          # The paths are put together here so this file itself stays clean. A binary holds a
          # Windows path with single backslashes.
          b="$(printf '\134')"
          printf 'x\0at /%s/builder/work/src/main.rs\0' home > "$RUNNER_TEMP/planted-home"
          printf 'x\0at /%s/.cargo/x/y.rs\0' root > "$RUNNER_TEMP/planted-root"
          printf 'x\0at C:%sUsers%sbuilder%swork\0' "$b" "$b" "$b" > "$RUNNER_TEMP/planted-windows"
          printf 'x\0at /opt/ci/.cargo/%s/src/index-0/a-1.0.0/src/lib.rs\0' registry > "$RUNNER_TEMP/planted-registry"
          printf 'x\0at /cargo/registry/src/a-1.0.0/src/lib.rs and /build/src/main.rs\0' > "$RUNNER_TEMP/clean"
          python3 tools/leak-check.py --files "$RUNNER_TEMP/clean"
          for f in "$RUNNER_TEMP"/planted-*; do
            if python3 tools/leak-check.py --files "$f"; then
              echo "::error::leak-check --files passed $(basename "$f")"; exit 1
            fi
          done

  workflows:
    name: workflow syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash) 1.7.4
          ./actionlint -color
